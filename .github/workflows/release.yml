name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the publish job adds id-token for PyPI's
# trusted publishing and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      # Only the distributions — pypi-publish rejects a directory containing
      # anything else, and SHA256SUMS is not a distribution.
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Must match the PyPI trusted publisher configuration exactly: this
    # workflow filename and this environment name are both part of the claim
    # PyPI verifies.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
